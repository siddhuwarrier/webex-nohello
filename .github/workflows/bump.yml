name: Bump

# Decides the next version from the commit messages on main, tags it, and hands off to the
# release workflow. Nothing here publishes; that is release.yml's job.
#
# A commit whose subject has no conventional-commit type produces no release at all, which is
# deliberate: a README fix should not ship a new version to PyPI.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    # commitizen's own bump commit lands on main and would otherwise start this again. It
    # would find nothing to bump and stop, but skipping outright is clearer than relying on
    # that, and saves a pointless run.
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    permissions:
      # To push the bump commit and the tag.
      contents: write
      # To hand off to release.yml. A workflow_dispatch is one of the few events the
      # GITHUB_TOKEN is allowed to trigger; a tag it pushes would start nothing.
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          # commitizen reads the log back to the previous tag to decide the bump, so a
          # shallow clone would make it guess wrong.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --all-extras --dev

      - name: Identify as the bot that is doing the committing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Work out the next version
        id: bump
        # --files-only, so commitizen decides the version and writes the files but does not
        # commit or tag. The lockfile records the project's own version and has to be
        # refreshed in the same commit, or every later `uv sync --locked` fails on a
        # lockfile that disagrees with pyproject.toml.
        run: |
          previous=$(uv run cz version --project)
          set +e
          uv run cz bump --yes --changelog --files-only
          code=$?
          set -e
          # Two ways for there to be nothing to release, and neither is a failure: 21 is
          # "commits exist but none of them bump the version" — docs, chores, refactors —
          # and 3 is "no commits at all since the tag". Every other non-zero code is real.
          if [ "$code" -eq 21 ] || [ "$code" -eq 3 ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to release: no conventional commits since the last tag."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::cz bump failed with exit code $code"
            exit "$code"
          fi
          version=$(uv run cz version --project)
          uv lock
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumping $previous to $version"

      - name: Commit, tag and push
        if: steps.bump.outputs.released == 'true'
        # The tag is pushed by name rather than with --follow-tags: that flag pushes only
        # annotated tags and exits zero having pushed nothing, so a missing tag looks like
        # a green step while the release never runs.
        env:
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "bump: version $PREVIOUS → $VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          # --atomic: both refs or neither. A pushed commit without its tag leaves main
          # claiming a version that was never released, and CHANGELOG.md then names a
          # version with no tag — which cz refuses to write an incremental changelog against.
          git push --atomic origin main "v$VERSION"

      - name: Hand off to the release workflow
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Dispatched at the new tag rather than at main, so release.yml sees a tag ref and
        # performs its tag-matches-version check instead of skipping it.
        run: |
          gh workflow run release.yml \
            --ref "v${{ steps.bump.outputs.version }}" \
            -f target=pypi

      - name: Say what happened
        run: |
          if [ "${{ steps.bump.outputs.released }}" = "true" ]; then
            echo "### Released v${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "release.yml is publishing it now." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release" >> "$GITHUB_STEP_SUMMARY"
            echo "No conventional commits since the last tag, so nothing was bumped." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
